<div class="p-4 mb-3 bg-light rounded sidebar-widget shadow-sm">
  <h4 class="fst-italic section-title">
    <span>Most Popular</span>
  </h4>
  <ul class="list-unstyled mb-0 popular-list">
    <!-- Changed ol to ul for flexibility -->
    {% for popular_post in popular_posts %}
    <li>
      <img
        src="{{ popular_post.featured_image.url }}"
        alt="Popular 1"
      />
      <div>
        <a href="{% url 'post-detail'  popular_post.pk %}" class="popular-title-link"
          >{{ popular_post.title }}</a
        >
        <p class="popular-description">
          {{ popular_post.content| truncatewords:15 }}
        </p>
      </div>
    </li>
    {% endfor %}
  </ul>
</div>
